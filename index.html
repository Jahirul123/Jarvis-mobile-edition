<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b1a">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="refresh" content="0; url=./Frontend/">
  <link rel="canonical" href="./Frontend/">
  <title>J.A.R.V.I.S — Personal AI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(900px 520px at 80% -10%, rgba(90, 60, 190, 0.32), transparent 62%),
        #070b1a;
      color: #f3f6ff;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
      text-align: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 380px;
      padding: 30px 26px;
      border-radius: 22px;
      border: 1px solid rgba(82, 233, 255, 0.24);
      background: rgba(14, 21, 48, 0.86);
      box-shadow: 0 18px 45px rgba(2, 6, 20, 0.55);
    }
    img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 0 28px rgba(82, 233, 255, 0.4); }
    h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0.22em;
      font-weight: 700;
      color: #52e9ff;
    }
    p { margin: 0; font-size: 13.5px; line-height: 1.55; color: #9fadd5; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      padding: 12px 22px;
      border-radius: 99px;
      background: linear-gradient(140deg, #52e9ff, #9b7bff);
      color: #04121c;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-decoration: none;
    }
    a:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <main class="card">
    <img src="./Frontend/icon.svg" alt="J.A.R.V.I.S logo">
    <h1>J.A.R.V.I.S</h1>
    <p>Opening your personal AI assistant…</p>
    <a href="./Frontend/">LAUNCH J.A.R.V.I.S →</a>
  </main>
  <script>window.location.replace('./Frontend/');</script>
</body>
</html>
